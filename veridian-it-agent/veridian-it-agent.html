<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veridian IT Service Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfc; --ink:#14171c; --ink-2:#4d5560;
  --ink-3:#818a96; --line:#e3e6ea; --line-2:#eef0f3;
  --accent:#2f5bd6; --accent-soft:#e8eefc;
  --ok:#0f8a5f; --ok-soft:#e3f5ec;
  --warn:#b4700c; --warn-soft:#fdf1dd;
  --danger:#c0392f; --danger-soft:#fbe9e7;
  --violet:#6a45c4; --violet-soft:#f0eaff;
  --radius:12px;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161a21; --panel-2:#1b2029; --ink:#e8ecf2; --ink-2:#a9b2bf;
    --ink-3:#6f7885; --line:#272d37; --line-2:#1f242d;
    --accent:#7aa2ff; --accent-soft:#1b2437;
    --ok:#4ad295; --ok-soft:#13291f;
    --warn:#e3ad52; --warn-soft:#2c2313;
    --danger:#ff8a7a; --danger-soft:#2e1a17;
    --violet:#b39bff; --violet-soft:#241c38;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a21; --panel-2:#1b2029; --ink:#e8ecf2; --ink-2:#a9b2bf;
  --ink-3:#6f7885; --line:#272d37; --line-2:#1f242d;
  --accent:#7aa2ff; --accent-soft:#1b2437;
  --ok:#4ad295; --ok-soft:#13291f;
  --warn:#e3ad52; --warn-soft:#2c2313;
  --danger:#ff8a7a; --danger-soft:#2e1a17;
  --violet:#b39bff; --violet-soft:#241c38;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--violet));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--ink-3)}
.spacer{flex:1}
.tabs{display:flex;gap:2px;max-width:1280px;margin:0 auto;padding:0 18px;overflow-x:auto}
.tab{padding:9px 13px;font-size:13px;font-weight:500;color:var(--ink-2);border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-h{padding:11px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.card-h h2{font-size:12px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.list{max-height:70vh;overflow:auto}
.item{padding:11px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{background:var(--panel-2)}
.item.on{background:var(--accent-soft)}
.item .id{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;width:52px;padding-top:1px}
.item .txt{flex:1;min-width:0}
.item .who{font-weight:600;font-size:12.5px}
.item .msg{font-size:12px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.p-new{background:var(--line-2);color:var(--ink-2)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-dan{background:var(--danger-soft);color:var(--danger)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-vio{background:var(--violet-soft);color:var(--violet)}
button.btn{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.pri:hover{opacity:.9;color:#fff}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.body{padding:14px}
.sec{margin-bottom:16px}
.sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:6px}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 10px;color:var(--ink-2);font-size:13px}
.kbchip{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;background:var(--panel-2)}
.kbchip .k{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500}
.kbchip .t{font-size:12.5px;font-weight:600;margin:1px 0}
.kbchip .b{font-size:12px;color:var(--ink-2)}
.reply{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;white-space:pre-wrap}
ul.q{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
ul.q li{margin-bottom:3px}
pre{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px;overflow:auto;margin:0;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
td.mono{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.empty{padding:50px 20px;text-align:center;color:var(--ink-3);font-size:13px}
textarea{width:100%;font-family:var(--sans);font-size:13px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag{font-size:12px;padding:7px 10px;border-radius:9px;background:var(--danger-soft);color:var(--danger);border:1px solid transparent;margin-bottom:5px}
.flag.w{background:var(--warn-soft);color:var(--warn)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mbox{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel-2)}
.mbox .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.mbox .v{font-size:13px;font-weight:600;margin-top:1px}
.doc{max-width:860px}
.doc h3{font-size:15px;margin:22px 0 6px}
.doc p,.doc li{font-size:13.5px;color:var(--ink-2)}
.doc code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.scroll{overflow-x:auto}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.banner{font-size:12px;color:var(--ink-2);background:var(--warn-soft);color:var(--warn);padding:7px 12px;border-radius:9px;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">V</div>
    <div>
      <h1>Veridian IT Service Agent</h1>
      <div class="sub">Internal employee support &middot; Tier-1 IT &middot; week of 21–25 Sep 2026</div>
    </div>
    <div class="spacer"></div>
    <span id="mode" class="pill p-new">engine: rules</span>
    <button class="btn" id="themeBtn">Theme</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="queue">Work queue</button>
    <button class="tab" data-t="ask">Ask the agent</button>
    <button class="tab" data-t="audit">Audit trail</button>
    <button class="tab" data-t="kb">Knowledge base</button>
    <button class="tab" data-t="docs">Architecture &amp; docs</button>
  </div>
</header>
<main>
  <section id="v-queue">
    <div class="grid">
      <div class="card">
        <div class="card-h">
          <h2>Intake</h2><div class="spacer"></div>
          <button class="btn" id="runAll">Triage all</button>
        </div>
        <div class="list" id="queueList"></div>
      </div>
      <div class="card" id="detail"><div class="empty">Select a request or ticket to run the agent.</div></div>
    </div>
  </section>

  <section id="v-ask" style="display:none">
    <div class="card" style="max-width:820px">
      <div class="card-h"><h2>New employee issue</h2></div>
      <div class="body">
        <textarea id="askTxt" rows="3" placeholder="e.g. I'm a contractor starting Monday and I need VPN on my own laptop"></textarea>
        <div class="row" style="margin-top:9px">
          <input id="askWho" placeholder="Employee name" style="flex:1;min-width:160px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-family:var(--sans);font-size:13px">
          <button class="btn pri" id="askGo">Run agent</button>
        </div>
      </div>
    </div>
    <div id="askOut" style="margin-top:16px"></div>
  </section>

  <section id="v-audit" style="display:none">
    <div class="card">
      <div class="card-h"><h2>Append-only audit log</h2><div class="spacer"></div>
        <span class="sub" id="auditCount"></span>
        <button class="btn" id="expJson">Export JSON</button>
        <button class="btn" id="expCsv">Export CSV</button>
      </div>
      <div class="scroll"><table id="auditTbl"><thead><tr><th>Event</th><th>Time</th><th>Case</th><th>Actor</th><th>Action</th><th>Sources</th><th>Detail</th></tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section id="v-kb" style="display:none">
    <div class="card"><div class="card-h"><h2>Grounding corpus — 11 policy documents</h2></div>
      <div class="body" id="kbList"></div></div>
  </section>

  <section id="v-docs" style="display:none"><div class="doc" id="docs"></div></section>
</main>

<script>
/* ============ 1. GROUNDING CORPUS (verbatim from the data pack) ============ */
const KB = [
 {id:"KB-01",t:"Password Reset",b:"Employees can reset their own password via the self-service portal at any time. If locked out after 5 failed attempts, contact IT to unlock the account manually. No approval required."},
 {id:"KB-02",t:"VPN Access",b:"VPN access is granted automatically to all full-time employees. Contractors require manager approval submitted via the access request form. VPN credentials expire every 90 days and must be renewed by the employee."},
 {id:"KB-03",t:"Laptop Replacement",b:"Laptops are eligible for replacement after 3 years of service, or earlier in case of verified hardware failure. Requests must be raised at least 2 weeks in advance of intended replacement."},
 {id:"KB-04",t:"Software Installation Requests",b:"Standard software (listed in the approved catalog) can be self-installed. Non-catalog software requires IT Security review, which takes 3–5 business days."},
 {id:"KB-05",t:"Printer Troubleshooting",b:"For printer issues, first check the printer queue and restart the print spooler. If the issue persists after restart, log a ticket with the printer's asset tag."},
 {id:"KB-06",t:"Email Mailbox Quota",b:"Default mailbox quota is 25GB. Employees nearing quota should archive old mail. Quota increases beyond 25GB require manager approval and are capped at 50GB."},
 {id:"KB-07",t:"Guest Wi-Fi Access",b:"Guest Wi-Fi credentials are valid for 24 hours and can be generated by any employee from the front-desk kiosk. No IT ticket required."},
 {id:"KB-08",t:"Expense Software Access",b:"Access to the expense management tool is granted by Finance, not IT. IT can only assist with login/technical issues once an account already exists."},
 {id:"KB-09",t:"Security Incident Reporting",b:"Any suspected phishing email, malware, or unauthorized access attempt must be reported to security@veridian-corp.example immediately and should not be forwarded to other employees."},
 {id:"KB-10",t:"Work-From-Home Equipment",b:"Employees working remotely more than 3 days/week are eligible for a one-time home office equipment allowance (chair, monitor). Requires manager sign-off and Finance processing — IT only handles the equipment shipping request once approved."},
 {id:"AMP-01",t:"Asset Management Policy (extract) — Finance & Assets, Q2 2026",b:"All company-issued hardware, including laptops and monitors, follows a standard 4-year refresh cycle from date of issue. Early replacement outside this cycle requires Finance sign-off in addition to IT approval."}
];
const kb = id => KB.find(k=>k.id===id);

/* ============ 2. CASE DATA ============ */
const REQS = [
 {id:"REQ-01",who:"Aditi Sharma",email:"aditi.sharma@veridiancorp.example",date:"Mon 21 Sep",text:"My laptop won't turn on at all, it's completely dead, had it about 3.5 years now.",state:"Not started"},
 {id:"REQ-02",who:"Vikram Chawla",email:"vikram.chawla@veridiancorp.example",date:"Mon 21 Sep",text:"Can I get Wi-Fi access for a guest visiting our office tomorrow?",state:"Not started"},
 {id:"REQ-03",who:"Karan Mehta",email:"karan.mehta@veridiancorp.example",date:"Mon 21 Sep",text:"I'm locked out of my account, tried my password 6 times.",state:"In progress — reset queued"},
 {id:"REQ-04",who:"Ritu Bhatia",email:"ritu.bhatia@veridiancorp.example",date:"Tue 22 Sep",text:"Need approval to install a data-analysis tool that's not in the software catalog.",state:"Waiting on Security review"},
 {id:"REQ-05",who:"Sanjay Oberoi",email:"sanjay.oberoi@veridiancorp.example",date:"Tue 22 Sep",text:"My VPN stopped working this morning, says credentials expired.",state:"Not started"},
 {id:"REQ-06",who:"Meera Iyer",email:"meera.iyer@veridiancorp.example",date:"Tue 22 Sep",text:"Printer on the 3rd floor keeps showing \u201Cpaper jam\u201D even though there's no jam.",state:"Investigating — technician assigned"},
 {id:"REQ-07",who:"Farhan Ali",email:"farhan.ali@veridiancorp.example",date:"Wed 23 Sep",text:"I've started working from home 4 days a week, how do I get a monitor?",state:"Not started"},
 {id:"REQ-08",who:"Ananya Reddy",email:"ananya.reddy@veridiancorp.example",date:"Wed 23 Sep",text:"I think I got a phishing email asking for my login — forwarding it to a few teammates to check.",state:"Escalated to Security (auto-flagged)"},
 {id:"REQ-09",who:"Rohit Desai",email:"rohit.desai@veridiancorp.example",date:"Wed 23 Sep",text:"My mailbox is full and I can't send emails.",state:"Not started"},
 {id:"REQ-10",who:"Kavya Pillai",email:"kavya.pillai@veridiancorp.example",date:"Wed 23 Sep",text:"Can someone give me admin access to the finance reporting server? Need it urgently for month-end.",state:"Not started"},
 {id:"REQ-11",who:"Nikhil Bansal",email:"nikhil.bansal@veridiancorp.example",date:"Thu 24 Sep",text:"New contractor joining my team next week, they'll need VPN access.",state:"Not started"},
 {id:"REQ-12",who:"Sneha Kulkarni",email:"sneha.kulkarni@veridiancorp.example",date:"Thu 24 Sep",text:"I can't log into the expense tool, keeps saying invalid credentials.",state:"Waiting on employee response (asked for a screenshot, no reply yet)"},
 {id:"REQ-13",who:"Aman Gupta",email:"aman.gupta@veridiancorp.example",date:"Thu 24 Sep",text:"Laptop screen is flickering on and off, had it 2 years, might just need a fix not a replacement.",state:"Not started"},
 {id:"REQ-14",who:"Tanya Chopra",email:"tanya.chopra@veridiancorp.example",date:"Fri 25 Sep",text:"Requesting approval to install a browser extension for productivity tracking.",state:"Not started"},
 {id:"REQ-15",who:"Rahul Menon",email:"rahul.menon@veridiancorp.example",date:"Fri 25 Sep",text:"hey can you help, its not working",state:"Not started"}
];
const TKS = [
 {id:"TK-1042",who:"R. Verma",text:"VPN credential expired",state:"Resolved (closed)",closed:true},
 {id:"TK-1043",who:"S. Iyer",text:"Laptop replacement (3.2 yrs old)",state:"Approved — pending fulfillment (active)",closed:false},
 {id:"TK-1044",who:"A. Khan",text:"Non-catalog software request",state:"Pending Security review (active)",closed:false},
 {id:"TK-1045",who:"P. Joshi",text:"Mailbox quota increase",state:"Approved at 35GB (closed)",closed:true},
 {id:"TK-1046",who:"M. Das",text:"Printer paper jam, floor 2",state:"Resolved (closed)",closed:true},
 {id:"TK-1047",who:"K. Singh",text:"Home office equipment request",state:"Pending Finance (active)",closed:false},
 {id:"TK-1048",who:"T. Rao",text:"Phishing email reported",state:"Escalated to Security — under investigation (active)",closed:false},
 {id:"TK-1049",who:"V. Nambiar",text:"Password reset",state:"Resolved (closed)",closed:true},
 {id:"TK-1050",who:"J. Fernandes",text:"Admin access request",state:"Rejected — no business justification provided (closed)",closed:true},
 {id:"TK-1051",who:"L. Menon",text:"Guest Wi-Fi issued",state:"Resolved (closed)",closed:true}
];

/* ============ 3. POLICY / ROUTING RULES ENGINE (deterministic layer) ============ */
// Each rule = intent detection + grounded decision. The LLM layer never overrides
// the decision or the citations; it only drafts employee-facing language.
const RULES = [
{intent:"Guest Wi-Fi", any:["guest wi-fi","guest wifi","wi-fi access for a guest","visitor"], kb:["KB-07"],
 decision:"RESOLVE", cat:"Network / Access", pri:"P4", risk:"Low", auto:true, sla:"Immediate — self-service",
 action:"Deflect to self-service: guest credentials are generated at the front-desk kiosk, valid 24h. No ticket required.",
 followups:["Is the visit on-site tomorrow (credentials expire 24h after generation)?"],
 precedent:"TK-1051 — guest Wi-Fi issued, resolved with no IT involvement."},

{intent:"Account lockout", any:["locked out","lock out","failed attempts","tried my password"], kb:["KB-01"],
 decision:"RESOLVE", cat:"Identity", pri:"P2", risk:"Low", auto:true, sla:"Same business day",
 action:"6 failed attempts exceeds the 5-attempt threshold, so self-service reset is unavailable. IT performs a manual unlock; no approval required.",
 followups:["Confirming identity: can you verify your employee ID before we unlock?"],
 precedent:"TK-1049 — password reset, resolved."},

{intent:"VPN credential expiry", any:["credentials expired","vpn stopped","vpn not working","vpn credential"], not:["contractor"], kb:["KB-02"],
 decision:"RESOLVE", cat:"Network / Access", pri:"P2", risk:"Low", auto:true, sla:"Same business day",
 action:"Expected behaviour, not an outage: VPN credentials expire every 90 days and are renewed by the employee. Guide through self-renewal.",
 followups:["Have you tried the renewal flow, and does it error at any step?"],
 precedent:"TK-1042 — identical case, resolved."},

{intent:"VPN for contractor", any:["contractor"], all:["vpn"], kb:["KB-02"],
 decision:"ESCALATE", to:"Requesting manager → Access Request Form", cat:"Network / Access", pri:"P3", risk:"Medium", auto:false, sla:"Before contractor start date",
 action:"Contractors are not auto-provisioned. Blocked pending manager approval via the access request form; IT cannot grant this directly.",
 followups:["Contractor's full name, start date and engagement end date?","Will they use a company-issued or personal device?","Can you submit the access request form today so provisioning lands before their start date?"],
 precedent:"None in queue."},

{intent:"Laptop — hardware failure", any:["won't turn on","wont turn on","completely dead","dead laptop"], kb:["KB-03","AMP-01"],
 decision:"ESCALATE", to:"IT Hardware + Finance & Assets (policy conflict)", cat:"Hardware", pri:"P1", risk:"Medium", auto:false, sla:"4 business hours — employee fully blocked",
 action:"Verified hardware failure route under KB-03, but the device is 3.5 yrs old and the Asset Management Policy sets a 4-year refresh cycle — early replacement needs Finance sign-off in addition to IT approval. Agent does not resolve a policy conflict on its own.",
 conflict:"KB-03 allows replacement after 3 years; AMP-01 (Finance, Q2 2026, newer) mandates 4 years + Finance sign-off for early replacement. The agent flags the conflict rather than picking a winner.",
 followups:["Does the laptop show any power light or charging indicator?","Have you tried a different charger and a 30-second power drain?","Can we issue a loaner while the replacement is decided?"],
 precedent:"TK-1043 — 3.2-yr laptop replacement approved, pending fulfilment. Suggests precedent for approval at <4 yrs, which strengthens the case put to Finance."},

{intent:"Laptop — repairable fault", any:["flickering","screen flicker"], kb:["KB-03"],
 decision:"RESOLVE", cat:"Hardware", pri:"P3", risk:"Low", auto:false, sla:"2 business days",
 action:"Treat as repair, not replacement. At 2 years the device is outside both the 3-yr (KB-03) and 4-yr (AMP-01) windows, and the employee has not claimed total failure. Book a hardware diagnostic.",
 followups:["Does the flicker change when you move the lid, or on an external monitor?","Is a bench slot this week workable, or do you need a loaner?"],
 precedent:"None."},

{intent:"Non-catalog software", any:["not in the software catalog","non-catalog","data-analysis tool"], kb:["KB-04"],
 decision:"ESCALATE", to:"IT Security review", cat:"Software", pri:"P3", risk:"Medium", auto:false, sla:"3–5 business days (policy SLA)",
 action:"Non-catalog software requires IT Security review. Already in the correct queue — agent's job is to confirm placement, set the expectation window and chase, not re-open.",
 followups:["Vendor name, version and data classification the tool will touch?","Is there a catalog alternative that would unblock you sooner?"],
 precedent:"TK-1044 — same category, pending Security review. Handle consistently."},

{intent:"Browser extension install", any:["browser extension","extension for productivity"], kb:["KB-04","KB-09"],
 decision:"ESCALATE", to:"IT Security review", cat:"Software", pri:"P3", risk:"Medium", auto:false, sla:"3–5 business days",
 action:"A browser extension is software and is not in the approved catalog, so KB-04 applies. Productivity-tracking extensions typically read page content, which raises a data-exposure question for Security.",
 followups:["Which extension, and what permissions does its store listing request?","Will it be installed on the managed work profile?"],
 precedent:"TK-1044 — non-catalog software, same review path."},

{intent:"Printer fault", any:["printer","paper jam","print spooler"], kb:["KB-05"],
 decision:"RESOLVE", cat:"Peripherals", pri:"P3", risk:"Low", auto:false, sla:"1 business day",
 action:"Run the KB-05 first-line sequence (check queue, restart spooler). Phantom jam usually clears with a spooler restart; if not, ticket needs the printer asset tag.",
 followups:["What is the asset tag on the 3rd-floor printer? KB-05 requires it on the ticket.","Does the error clear for other users, or is it device-wide?"],
 precedent:"TK-1046 — floor-2 paper jam, resolved via the same path."},

{intent:"Mailbox quota", any:["mailbox is full","mailbox quota","can't send emails","mailbox full"], kb:["KB-06"],
 decision:"RESOLVE", cat:"Email", pri:"P2", risk:"Low", auto:false, sla:"Same business day",
 action:"First-line remedy is archiving old mail against the 25GB default. An increase above 25GB is only available with manager approval and is capped at 50GB — offer that as the second path, do not grant it.",
 followups:["Current mailbox size, and would archiving mail older than 12 months get you under 25GB?","If not, can your manager approve an increase? Precedent sits at 35GB."],
 precedent:"TK-1045 — quota increase approved at 35GB, within the 50GB cap."},

function classify(text){
  const s = (" "+text+" ").toLowerCase();
  let best=null, bestScore=0;
  for(const r of RULES){
    if(r.not && r.not.some(n=>s.includes(n))) continue;
    if(r.all && !r.all.every(a=>s.includes(a))) continue;
    let hits = r.any.filter(k=>s.includes(k)).length;
    if(r.all) hits += r.all.length;
    if(hits>bestScore){bestScore=hits;best=r;}
  }
  if(!best) return {rule:RULES[RULES.length-1], conf:0.35};
  let conf = Math.min(0.96, 0.62 + bestScore*0.14);
  if(best.vague) conf = 0.34;
  return {rule:best, conf};
}

/* ============ 4. AUDIT TRAIL ============ */
const AUDIT=[]; let evt=0;
function log(caseId, actor, action, sources, detail){
  evt++;
  AUDIT.unshift({e:"EV-"+String(evt).padStart(4,"0"), ts:new Date().toISOString().replace("T"," ").slice(0,19)+"Z",
    caseId, actor, action, sources:(sources||[]).join(", ")||"—", detail:detail||""});
  renderAudit();
}

/* ============ 5. AGENT RUN ============ */
let TICKETSEQ=1060;
function runAgent(c){
  const {rule, conf} = classify(c.text);
  log(c.id,"agent","intake.received",[], "Channel: "+(c.kind||"request")+" · reported state: "+(c.state||"new"));
  log(c.id,"agent","intent.classified",[], rule.intent+" (confidence "+conf.toFixed(2)+")");
  if(rule.kb.length) log(c.id,"agent","policy.retrieved",rule.kb,"Grounded in "+rule.kb.length+" source(s)");
  if(rule.gap) log(c.id,"agent","policy.gap_detected",[],rule.gap);
  if(rule.conflict) log(c.id,"agent","policy.conflict_detected",rule.kb,rule.conflict);
  if(rule.breach) log(c.id,"agent","policy.violation_detected",["KB-09"],rule.breach);
  const tid = "TK-"+(++TICKETSEQ);
  const ticket = {
    ticket_id: tid, source_case: c.id, opened: c.date || "Fri 25 Sep 2026",
    requester: {name:c.who, email:c.email||"—"},
    category: rule.cat, intent: rule.intent,
    priority: rule.pri, risk: rule.risk,
    decision: rule.decision,
    autonomous: !!rule.auto,
    routed_to: rule.decision==="RESOLVE" ? "IT Service Desk — Tier 1" : (rule.to || "Employee — awaiting response"),
    sla: rule.sla,
    policy_sources: rule.kb,
    policy_conflict: rule.conflict || null,
    policy_gap: rule.gap || null,
    confidence: Number(conf.toFixed(2)),
    status: rule.decision==="RESOLVE" ? (rule.auto?"Resolved by agent":"Actioned — awaiting employee confirmation")
          : rule.decision==="CLARIFY" ? "Awaiting employee response" : "Escalated — human owner assigned",
    audit_ref: "EV-"+String(evt).padStart(4,"0")
  };
  log(c.id,"agent","ticket.created",rule.kb, tid+" · "+rule.decision+" · "+rule.pri+" · owner: "+ticket.routed_to);
  if(rule.decision!=="RESOLVE") log(c.id,"agent","handoff.requested",[], "Routed to "+ticket.routed_to+" — agent did not act autonomously");
  return {rule, conf, ticket};
}

function fallbackReply(c, rule){
  const name = (c.who||"there").split(" ")[0];
  let r = "Hi "+name+",\n\n"+rule.action+"\n\n";
  if(rule.followups && rule.followups.length){
    r += "To move this forward:\n" + rule.followups.map(q=>"• "+q).join("\n") + "\n\n";
  }
  r += "Policy reference: " + (rule.kb.length? rule.kb.join(", ") : "no KB article covers this — handing to a human") + ".\n— Veridian IT Service Agent";
  return r;
}

(async()=>{ try{ sampleFn = await claude.use("sample"); if(sampleFn){ const m=document.getElementById("mode"); m.textContent="engine: rules + LLM"; m.className="pill p-ok"; } }catch(e){} })();

async function draftReply(c, rule, conf){
  if(!sampleFn) return null;
  const sources = rule.kb.map(id=>{const k=kb(id);return k.id+" "+k.t+": "+k.b}).join("\n");
  const prompt = `You are the Veridian Corp IT Service Agent writing to an employee.
Write ONLY the reply body. Warm, plain, 90-140 words. No greeting fluff, no invented policy.

EMPLOYEE: ${c.who}
THEIR MESSAGE: "${c.text}"
CURRENT CASE STATE: ${c.state||"new"}

THE ONLY POLICY YOU MAY CITE (do not add any other rule):
${sources||"(none — no policy covers this request)"}

DECISION ALREADY MADE BY THE POLICY ENGINE (do not change it): ${rule.decision}
REASONING YOU MUST CONVEY: ${rule.action}
${rule.conflict?"FLAG THIS CONFLICT: "+rule.conflict:""}
${rule.breach?"URGENT — TELL THEM TO STOP: "+rule.breach:""}
${rule.gap?"NOTE: "+rule.gap:""}
ASK THESE FOLLOW-UPS (rephrase naturally, keep all of them): ${(rule.followups||[]).join(" | ")}

Cite the policy IDs inline like (KB-03). Sign off as "— Veridian IT Service Agent".`;
  try{ const r = await sampleFn(prompt,{modelTier:"quick"}); return r.text; }catch(e){ return null; }
}

<h3>Decision policy</h3>
<p><b>RESOLVE</b> when one policy fully covers the case and the action is reversible and low risk (guest Wi-Fi, account unlock, VPN renewal, printer first-line, mailbox archiving). <b>CLARIFY</b> when the routing hinges on a fact the employee hasn't given. <b>ESCALATE</b> when another function owns the approval (Finance, Security, manager), when two policies conflict, when no policy exists, or when the risk is irreversible — privileged access, security incidents, spend.</p>

<h3>Notable judgement calls in this data set</h3>
<ul>
<li><b>REQ-01 — policy conflict.</b> KB-03 says 3 years; the newer Asset Management Policy says 4 years plus Finance sign-off. The agent surfaces the conflict and the TK-1043 precedent instead of picking a side.</li>
<li><b>REQ-08 — live policy breach.</b> The employee is forwarding a phishing mail, which KB-09 forbids. Containment instruction first, escalation second.</li>
<li><b>REQ-10 — no policy at all.</b> Nothing in the corpus authorises admin access. Agent reports a knowledge gap and matches the TK-1050 rejection precedent rather than inventing a rule.</li>
<li><b>REQ-15 — low confidence.</b> Confidence 0.34; the agent refuses to guess and asks scoping questions.</li>
<li><b>REQ-12 vs KB-08 — wrong-owner detection.</b> Expense-tool account creation belongs to Finance; IT only owns login faults once an account exists.</li>
<li><b>REQ-13 — repair, not replace.</b> A 2-year laptop fails both refresh windows, so the agent books a diagnostic instead of a replacement.</li>
</ul>

<h3>Inputs, sources and assumptions</h3>
<ul>
<li><b>Sources:</b> the 10 KB articles, the Asset Management Policy extract, 15 employee requests and 10 ticket-queue rows. Nothing else. No external lookups.</li>
<li><b>Assumption:</b> where KB-03 and the Asset Management Policy disagree, the agent treats neither as automatically winning — it flags for Finance. The AMP is newer (Q2 2026) and owned by Finance, which is noted in the escalation.</li>
<li><b>Assumption:</b> requesters in Section 2 are full-time employees unless stated (REQ-11 explicitly concerns a contractor).</li>
<li><b>Assumption:</b> priorities P1–P4 and SLA windows are agent-side conventions; the data pack defines only the 3–5 day Security review window, which is used verbatim.</li>
<li><b>Assumption:</b> closed tickets are read-only precedent; active tickets are triaged with the same engine as new requests.</li>
<li><b>Assumption:</b> the agent has no write access to Finance, Security or manager systems, so those paths are handoffs, never auto-approvals.</li>
</ul>

<h3>AI tools used</h3>
<ul>
<li><b>Claude (Opus) — build:</b> turned the data pack into the rule set, wrote the prototype, derived the escalation matrix and the edge cases above.</li>
<li><b>Claude (Sonnet, quick tier) — runtime:</b> called from inside the running app to draft each employee-facing reply. It is handed only the retrieved policy text and the decision already made; it cannot change the decision, the routing or the citations. If the model is unavailable the app falls back to deterministic templates, which is why the reply is labelled <i>LLM drafted</i> or <i>template</i>.</li>
<li><b>Deliberately not an LLM:</b> classification, decision, risk and routing stay in the rules engine so every outcome is reproducible and auditable — which is what an IT reviewer will ask about.</li>
</ul>

<h3>Why hybrid rather than pure LLM</h3>
<p>An IT service desk is judged on consistency and defensibility. Two identical tickets must get identical outcomes, and any decision must be traceable to a policy line. The rules layer gives that; the LLM gives the tone and the natural follow-ups that a decision tree writes badly. Swapping the classifier for an embedding retriever is the obvious next step, with the guardrails and the audit trail untouched.</p>

<h3>Known limits</h3>
<ul>
<li>Keyword classification, so a paraphrase far from the rule vocabulary lands in the low-confidence clarify path — safe, but blunt. Production fix: embedding retrieval over the same corpus.</li>
<li>Ticket writes are in-memory; the JSON is the real payload shape for a ServiceNow/Jira create call.</li>
<li>No identity verification beyond the follow-up question, and no live ITSM or email integration.</li>
</ul>`;

async function saveFile(name, data){

    const d = await claude.use("downloads");
    if(d){ await d.save({filename:name, data}); return; }

  const blob=new Blob([data],{type:"text/plain"}); const u=URL.createObjectURL(blob);

}
$("#expJson").onclick=()=>saveFile("veridian-audit-trail.json",JSON.stringify(AUDIT,null,2));
$("#expCsv").onclick=()=>{
  const rows=[["event","timestamp","case","actor","action","sources","detail"]].concat(AUDIT.map(a=>[a.e,a.ts,a.caseId,a.actor,a.action,a.sources,a.detail]));
  saveFile("veridian-audit-trail.csv", rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n"));
};

/* tabs */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  ["queue","ask","audit","kb","docs"].forEach(v=>$("#v-"+v).style.display = v===t.dataset.t?"":"none");
});
$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
};

/* ask tab */
$("#askGo").onclick=async()=>{
  const text=$("#askTxt").value.trim(); if(!text) return;
  const c={id:"ADHOC-"+Math.floor(Math.random()*900+100), who:$("#askWho").value.trim()||"Employee", email:"—", date:"Fri 25 Sep", text, state:"new", kind:"ad-hoc"};
  const O=$("#askOut"); O.innerHTML=`<div class="card"><div class="body"><div class="empty">Running<span class="spin" style="margin-left:6px"></span></div></div></div>`;
  const wrap=document.createElement("div"); wrap.className="card"; O.innerHTML=""; O.appendChild(wrap);
  const res=runAgent(c); paint(wrap,c,res,null);
  const txt=await draftReply(c,res.rule,res.conf); if(txt){ log(c.id,"agent","reply.drafted",res.rule.kb,"LLM draft"); paint(wrap,c,res,txt); }
};

/* triage all */
$("#runAll").onclick=async()=>{
  const btn=$("#runAll"); btn.disabled=true; btn.textContent="Triaging…";
  for(const c of REQS.concat(TKS.filter(t=>!t.closed))){ runAgent(c); }
  btn.textContent="All triaged — see audit"; 
  document.querySelector('.tab[data-t="audit"]').click();
};

renderQueue(); renderAudit(); renderKB();
</script>
</body>
</html>
